# Every push and pull request: the unit tests, an end-to-end run against a real VictoriaMetrics, and the
# browser checks. No cluster, no API key and no model call anywhere: the pipeline runs in mock mode.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install KubeSage
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Install the pinned kubectl (kustomize checks)
        run: |
          . scripts/versions.sh
          mkdir -p .bin
          curl -fsSL -o .bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x .bin/kubectl
      - name: pytest
        run: PATH="$PWD/.bin:$PATH" .venv/bin/python -m pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    services:
      victoriametrics:
        image: victoriametrics/victoria-metrics:v1.110.0
        ports: ["8428:8428"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install KubeSage
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Simulate a cluster, then allocate its costs and right-size it
        run: scripts/ci-e2e.sh http://127.0.0.1:8428

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install KubeSage and Chromium
        run: |
          python -m venv .venv && .venv/bin/pip install -e '.[dev]' playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser checks (mocked APIs)
        run: .venv/bin/python tests/browser_smoke.py --output-dir browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          retention-days: 7
