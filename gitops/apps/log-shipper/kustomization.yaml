apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
# Ownership: stopping the test case deletes everything carrying this label, a fix's additions included.
labels:
  - pairs: {kubesage.io/testcase: disk-io}
resources: [deployment.yaml]
configMapGenerator:
  - name: log-shipper-src
    files: [src/log_shipper.py]
