apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
# Ownership: stopping the test case deletes everything carrying this label, a fix's additions included.
labels:
  - pairs: {kubesage.io/testcase: memory}
resources: [deployment.yaml]
configMapGenerator:
  - name: ledger-cache-src
    files: [src/ledger_cache.py]
