apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-cache
  labels: {app: media-cache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: media-cache}
  template:
    metadata:
      labels: {app: media-cache}
    spec:
      nodeSelector: {kubesage.io/pool: lab}
      terminationGracePeriodSeconds: 2
      containers:
        - name: media-cache
          image: python:3.13.12-alpine3.22
          command: [python, -u, /src/media_cache.py]
          env:
            - {name: FILL_MB, value: "950"}
            - {name: FILL_MBPS, value: "10"}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: src, mountPath: /src}
            - {name: cache, mountPath: /cache}
      volumes:
        - {name: src, configMap: {name: media-cache-src}}
        - {name: cache, emptyDir: {sizeLimit: 1Gi}}
