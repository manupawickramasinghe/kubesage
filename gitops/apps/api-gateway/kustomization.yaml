apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
# Ownership: stopping the test case deletes everything carrying this label, a fix's additions included.
labels:
  - pairs: {kubesage.io/testcase: latency}
resources: [deployment.yaml, service.yaml]
configMapGenerator:
  - name: api-gateway-src
    files: [src/api_gateway.py]
