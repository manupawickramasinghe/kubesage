apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
# Ownership: stopping the test case deletes everything carrying this label, a fix's additions included.
labels:
  - pairs: {kubesage.io/testcase: cpu-throttle}
resources: [deployment.yaml]
configMapGenerator:
  - name: render-farm-src
    files: [src/render_farm.py]
