# The models the agent team can use. Each agent picks a size in its agent.yaml (`model: small`), so changing
# one agent's model is a one-line edit there, and changing what "small" means is a one-line edit here.
#
# KUBESAGE_MODELS selects the profile (the same variable the right-sizing pipeline uses); default_profile
# applies when it isn't set. Prices are USD per million tokens and drive every cost the UI shows.

default_profile: meta

profiles:
  # Cerebras' shared endpoint (Oct 2026) serves gpt-oss-120b ($0.35 / $0.75) and qwen-3.8-27b ($0.99 / $1.49).
  # Sub-agents get the smaller dense model; the Thinker and Executor get gpt-oss-120b at different effort.
  cerebras:
    provider: {base_url: https://api.cerebras.ai/v1, api_key_env: CEREBRAS_API_KEY, timeout_s: 120}
    models:
      small:
        label: Qwen 3.8 27B
        model: qwen-3.8-27b
        input_per_mtok: 0.99
        output_per_mtok: 1.49
        max_output_tokens: 6000
      medium:
        label: OSS 120B medium
        model: gpt-oss-120b
        input_per_mtok: 0.35
        output_per_mtok: 0.75
        max_output_tokens: 12000
        extra_body: {reasoning_effort: medium}
      large:
        label: OSS 120B high
        model: gpt-oss-120b
        input_per_mtok: 0.35
        output_per_mtok: 0.75
        max_output_tokens: 16000
        extra_body: {reasoning_effort: high}

  # Meta Model API (default; judges' profile). Verified Oct 2026: the API serves only
  # muse-spark-1.3 ($1.25/$0.15/$4.25) and muse-wonder-1.0 ($4.00/$0.20/$20.00) for chat.
  # Muse Glimmer is open-weight only and is NOT on api.meta.ai — never use it here.
  meta:
    provider: {base_url: https://api.meta.ai/v1, api_key_env: MODEL_API_KEY, timeout_s: 120}
    models:
      small: {label: Spark · small, model: muse-spark-1.3, input_per_mtok: 1.25, cached_input_per_mtok: 0.15, output_per_mtok: 4.25, max_output_tokens: 4000}
      medium: {label: Spark, model: muse-spark-1.3, input_per_mtok: 1.25, cached_input_per_mtok: 0.15, output_per_mtok: 4.25, max_output_tokens: 6000}
      large: {label: Wonder, model: muse-wonder-1.0, input_per_mtok: 4.00, cached_input_per_mtok: 0.20, output_per_mtok: 20.00, max_output_tokens: 8000}
