# LLM tiers for the 3-stage router. The Meta Model API is OpenAI-compatible.
#
# This is the default profile and the one judges run: no KUBESAGE_MODELS needed,
# just MODEL_API_KEY from https://dev.meta.ai (keys look like "LLM|...").
#
# Models and Standard-mode prices verified against Meta Model API docs and
# public pricing trackers, Oct 2026 (USD per 1M tokens: input / cached / output):
#   - muse-spark-1.3:  $1.25 / $0.15 / $4.25  (1M context, reasoning always on)
#   - muse-wonder-1.0: $4.00 / $0.20 / $20.00 (1M context, Standard mode only)
# There is no cheaper hosted Muse tier: Muse Glimmer is open-weight only and
# is NOT served on api.meta.ai, so it must never appear here as an API model.
# Cheaper triage option: set the triage model to muse-spark-1.3-contributor
# ($0.10 / $0.002 / $0.20) — only if you accept Contributor terms, under which
# Meta may train on inputs. KubeSage sends cluster statistics; judge for yourself.
# All costs shown by kubesage are computed from the numbers below.

provider:
  base_url: https://api.meta.ai/v1
  api_key_env: MODEL_API_KEY
  timeout_s: 120

tiers:
  # Stage 2: cheap, high-volume. Reads every workload's stats and decides who needs a bigger model.
  # Spark with a small output cap: reasoning tokens are billed as output, so the cap is the cost control.
  triage:
    label: Spark · triage
    model: muse-spark-1.3
    input_per_mtok: 1.25
    cached_input_per_mtok: 0.15
    output_per_mtok: 4.25
    max_output_tokens: 4000
    extra_body: {}                   # provider-specific knobs, e.g. {reasoning_effort: low}

  # Stage 3a: routine right-sizing and standard KEDA rules.
  worker:
    label: Spark
    model: muse-spark-1.3
    input_per_mtok: 1.25
    cached_input_per_mtok: 0.15
    output_per_mtok: 4.25
    max_output_tokens: 6000
    extra_body: {}

  # Stage 3b: root-cause reasoning (leaks, OOMs) and node-pool SKU planning.
  strategist:
    label: Wonder
    model: muse-wonder-1.0
    input_per_mtok: 4.00
    cached_input_per_mtok: 0.20
    output_per_mtok: 20.00
    max_output_tokens: 8000
    extra_body: {}
