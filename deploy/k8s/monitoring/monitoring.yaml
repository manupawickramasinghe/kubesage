# Live metrics: kube-state-metrics + vmagent scraping the kubelet's cAdvisor endpoint, remote-writing into
# the docker-compose VictoriaMetrics. Only the series KubeSage reads are kept. Applied by scripts/live-up.sh,
# which also creates the vmagent-remote ConfigMap holding VictoriaMetrics' address.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesage-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesage-kube-state-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubesage-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args: ["--resources=pods,deployments", "--port=8080", "--telemetry-port=8081"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8081}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector: {app: kube-state-metrics}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesage-vmagent
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesage-vmagent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubesage-vmagent}
subjects: [{kind: ServiceAccount, name: vmagent, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-scrape
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config: {insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{role: node}]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep
      - job_name: kube-state-metrics
        static_configs: [{targets: [kube-state-metrics.monitoring.svc:8080]}]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: kube_pod_container_resource_(requests|limits)|kube_pod_container_status_restarts_total|kube_deployment_spec_replicas
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: vmagent}
  template:
    metadata:
      labels: {app: vmagent}
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.110.0
          args:
            - -promscrape.config=/config/scrape.yml
            - -remoteWrite.url=$(REMOTE_WRITE_URL)
            - -remoteWrite.tmpDataPath=/tmp/vmagent
          env:
            - name: REMOTE_WRITE_URL
              valueFrom: {configMapKeyRef: {name: vmagent-remote, key: url}}
          volumeMounts: [{name: config, mountPath: /config}]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes: [{name: config, configMap: {name: vmagent-scrape}}]
