# EXAMPLE ONLY — never commit a filled copy. Create the real Secrets imperatively:
#   kubectl -n kubesage create secret generic kubesage-secrets --from-literal=MODEL_API_KEY='LLM|...'
#   kubectl -n kubesage create secret generic kubesage-git-key --from-file=ssh-privatekey=$HOME/.ssh/kubesage-executor
# The git key is a repo deploy key (write access) kept OUTSIDE any repo until you create this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kubesage-secrets
  namespace: kubesage
type: Opaque
stringData:
  MODEL_API_KEY: "REPLACE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: kubesage-git-key
  namespace: kubesage
type: Opaque
stringData:
  ssh-privatekey: "REPLACE-ME-WITH-DEPLOY-KEY-PRIVATE-KEY"
