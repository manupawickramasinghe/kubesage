# EXAMPLE: Flux reconciles KubeSage itself. Your workloads' KubeSage overlay lives in
# YOUR GitOps repo (the CronJob pushes branches there); give that repo its own
# GitRepository + Kustomization pointing at the overlay path (default
# kubesage/<namespace>) so merged KubeSage PRs roll out automatically.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubesage
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  sourceRef: {kind: GitRepository, name: kubesage}
  path: ./deploy/k8s/kubesage
  healthChecks:
    - {apiVersion: apps/v1, kind: Deployment, name: kubesage, namespace: kubesage}
