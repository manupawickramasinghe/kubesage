[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesage"
version = "0.1.0"
description = "AI FinOps agent for Kubernetes: right-sizing, proactive KEDA scaling and node SKU optimisation behind a cost-aware multi-model LLM router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kubesage = "kubesage.cli:main"

[tool.setuptools.packages.find]
include = ["kubesage*"]

[tool.setuptools.package-data]
"kubesage.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
